# cargo-deny policy for RustyDroid.
#
# cargo-audit remains useful, but it only answers the RustSec question. This
# file makes the broader graph policy executable: yanked releases, licenses,
# wildcard/duplicate declarations, and sources. RD Sentinel's JSON policy is
# still the approval/check-completeness authority; cargo-deny is one required
# dependency-campaign check, not the whole anti-regression gate.
#
# Keep every ignore crate-scoped, reasoned, and time-bounded.

[advisories]
ignore = []
yanked = "deny"
# Direct workspace dependencies are choices we can replace deliberately.
unmaintained = "workspace"
# Soundness advisories matter even when reached transitively.
unsound = "all"
unused-ignored-advisory = "deny"
maximum-db-staleness = "P30D"

[licenses]
unused-allowed-license = "warn"
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
exceptions = []
clarify = []

[licenses.private]
ignore = false

[bans]
# Cargo can legitimately resolve more than one major of a transitive crate.
# RD Sentinel separately blocks unexplained growth in duplicate names; making
# every current duplicate a hard cargo-deny failure would hide new ones in a
# permanently red check.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = false
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "deny"

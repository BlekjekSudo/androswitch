name: RD Sentinel

# Candidate code is analyzed with a read-only token. The default-branch
# `RD Sentinel Publish` workflow_run job is the only part allowed to comment,
# label, open issues, or set the verified commit status.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (leave blank to audit the selected ref)
        required: false
        type: string
      profile:
        description: Sentinel campaign profile
        required: true
        default: auto
        type: choice
        options: [auto, deep, nightly, weekly, perf, fuzz, deps, determinism, mutants, soak]
      campaign:
        description: Campaign name recorded in the report
        required: false
        default: manual
        type: string
      Fuzz_SECONDS:
        description: Optional fuzz seconds per target
        required: false
        type: string
      mutation_minutes:
        description: Optional changed-code mutation budget in minutes (1-240)
        required: false
        type: string
      baseline_proposal:
        description: Produce baseline evidence (never edits the baseline)
        required: false
        default: "false"
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rd-sentinel-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      verdict: ${{ steps.sentinel.outputs.verdict }}
    env:
      RD_SENTINEL_OUT: ${{ github.workspace }}/rd-sentinel-out
    steps:
      - name: Resolve trusted base and candidate identity
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PROFILE: ${{ inputs.profile || 'auto' }}
          INPUT_CAMPAIGN: ${{ inputs.campaign || 'manual' }}
          INPUT_FUZZ_SECONDS: ${{ inputs.Fuzz_SECONDS || '' }}
          INPUT_MUTATION_MINUTES: ${{ inputs.mutation_minutes || '' }}
          INPUT_BASELINE_PROPOSAL: ${{ inputs.baseline_proposal || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          out = {}

          def get_pr(number):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/pulls/{number}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          pr = event.get("pull_request") or {}
          pr_number = os.environ.get("INPUT_PR_NUMBER", "").strip()
          if not pr and pr_number:
              pr = get_pr(pr_number)
          if pr:
              out["pr_number"] = str(pr["number"])
              out["base_sha"] = pr["base"]["sha"]
              out["head_sha"] = pr["head"]["sha"]
              out["head_repo"] = pr["head"]["repo"]["full_name"]
              out["base_repo"] = pr["base"]["repo"]["full_name"]
              out["head_ref"] = pr["head"]["ref"]
              out["author"] = (pr.get("user") or {}).get("login", "")
              out["draft"] = "true" if pr.get("draft") else "false"
              out["labels"] = ",".join(label["name"] for label in pr.get("labels", []) if label.get("name"))
          elif os.environ.get("GITHUB_EVENT_NAME") == "merge_group":
              group = event.get("merge_group") or {}
              out.update({
                  "pr_number": "",
                  "base_sha": group.get("base_sha") or os.environ["GITHUB_SHA"],
                  "head_sha": group.get("head_sha") or os.environ["GITHUB_SHA"],
                  "head_repo": repo,
                  "base_repo": repo,
                  "head_ref": group.get("head_ref", ""),
                  "author": "",
                  "draft": "false",
                  "labels": "",
              })
          else:
              out.update({
                  "pr_number": "",
                  "base_sha": os.environ["GITHUB_SHA"],
                  "head_sha": os.environ["GITHUB_SHA"],
                  "head_repo": repo,
                  "base_repo": repo,
                  "head_ref": os.environ.get("GITHUB_REF_NAME", ""),
                  "author": os.environ.get("GITHUB_ACTOR", ""),
                  "draft": "false",
                  "labels": "",
              })
          labels = set(filter(None, out.get("labels", "").split(",")))
          profile = os.environ.get("INPUT_PROFILE") or "auto"
          if "sentinel:deep" in labels and profile == "auto":
              profile = "deep"
          actor = os.environ.get("GITHUB_ACTOR", "")
          if out.get("author") == "dependabot[bot]" and profile == "auto":
              profile = "deps"
          out["profile"] = profile
          out["campaign"] = os.environ.get("INPUT_CAMPAIGN") or os.environ.get("GITHUB_EVENT_NAME") or "manual"
          out["actor"] = actor
          out["Fuzz_SECONDS"] = os.environ.get("INPUT_FUZZ_SECONDS", "")
          mutation_minutes = os.environ.get("INPUT_MUTATION_MINUTES", "").strip()
          if mutation_minutes and (not mutation_minutes.isdigit() or not (1 <= int(mutation_minutes) <= 240)):
              mutation_minutes = ""
          out["mutation_minutes"] = mutation_minutes
          out["baseline_proposal"] = os.environ.get("INPUT_BASELINE_PROPOSAL", "false")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, value in out.items():
                  fh.write(f"{key}={value}\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Checkout candidate (untrusted, read-only token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.ctx.outputs.head_repo }}
          ref: ${{ steps.ctx.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted base policy and bot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.ctx.outputs.base_repo }}
          ref: ${{ steps.ctx.outputs.base_sha }}
          path: trusted
          # Full history lets the candidate fetch the base ancestry even for a
          # fork branch whose merge-base predates the current base tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Select trusted Sentinel home and fetch base into candidate history
        id: bot
        env:
          BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
          REQUESTED_PROFILE: ${{ steps.ctx.outputs.profile }}
        run: |
          set -euo pipefail
          if [ -f trusted/tools/rd-sentinel/rd_sentinel.py ]; then
            sentinel_home="$GITHUB_WORKSPACE/trusted"
            echo "Using Sentinel and policy from trusted base $BASE_SHA"
          else
            sentinel_home="$GITHUB_WORKSPACE/candidate"
            echo "::warning::Base has no RD Sentinel yet; bootstrap mode uses candidate bot, and protected-path approval remains mandatory."
          fi
          echo "home=$sentinel_home" >> "$GITHUB_OUTPUT"
          supports_v11=false
          if grep -q 'BOT_VERSION = "1.1' "$sentinel_home/tools/rd-sentinel/sentinel/model.py" 2>/dev/null; then
            supports_v11=true
          fi
          echo "supports_v11=$supports_v11" >> "$GITHUB_OUTPUT"
          effective_profile="$REQUESTED_PROFILE"
          if [ "$effective_profile" = "mutants" ] && [ "$supports_v11" != "true" ]; then
            # The trusted base bot predates the mutants profile. Fail safe to
            # the older deep campaign rather than crashing before a report.
            effective_profile="deep"
            echo "::warning::Trusted base RD Sentinel predates v1.1; mutants profile downgraded to deep for this bootstrap run."
          fi
          echo "effective_profile=$effective_profile" >> "$GITHUB_OUTPUT"
          if ! git -C candidate cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git -C candidate fetch --no-tags "$GITHUB_WORKSPACE/trusted/.git" "$BASE_SHA"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Compute risk-selected campaign plan
        id: plan
        env:
          SENTINEL_HOME: ${{ steps.bot.outputs.home }}
        run: |
          mkdir -p "$RD_SENTINEL_OUT"
          args=(
            plan
            --repo "$GITHUB_WORKSPACE/candidate"
            --policy "$SENTINEL_HOME/.github/rd-sentinel/policy.json"
            --baseline "$SENTINEL_HOME/.github/rd-sentinel/baseline.json"
            --base "${{ steps.ctx.outputs.base_sha }}"
            --head "${{ steps.ctx.outputs.head_sha }}"
            --profile "${{ steps.bot.outputs.effective_profile }}"
            --campaign "${{ steps.ctx.outputs.campaign }}"
            --event "$GITHUB_EVENT_PATH"
            --event-name "$GITHUB_EVENT_NAME"
            --actor "${{ steps.ctx.outputs.actor }}"
            --author "${{ steps.ctx.outputs.author }}"
            --head-ref "${{ steps.ctx.outputs.head_ref }}"
            --labels "${{ steps.ctx.outputs.labels }}"
            --repository "$GITHUB_REPOSITORY"
            --out "$RD_SENTINEL_OUT/plan.json"
          )
          if [ -n "${{ steps.ctx.outputs.pr_number }}" ]; then
            args+=(--pr-number "${{ steps.ctx.outputs.pr_number }}")
          fi
          set +e
          python3 "$SENTINEL_HOME/tools/rd-sentinel/rd_sentinel.py" "${args[@]}" > "$RD_SENTINEL_OUT/plan.log"
          plan_exit=$?
          set -e
          echo "plan_exit=$plan_exit" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          plan = json.load(open(os.path.join(os.environ["RD_SENTINEL_OUT"], "plan.json"), encoding="utf-8"))
          components = {item.get("component") for item in plan.get("plan", [])}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"needs_fuzz={'true' if 'fuzz' in components else 'false'}\n")
              fh.write(f"needs_apk={'true' if components & {'perf', 'compare', 'real-apk', 'determinism'} else 'false'}\n")
              fh.write(f"needs_deps={'true' if 'deps' in components or 'dep-trial' in components else 'false'}\n")
              fh.write(f"needs_mutation={'true' if 'mutation' in components else 'false'}\n")
              fh.write(f"needs_future={'true' if 'future' in components else 'false'}\n")
              fh.write(f"needs_golden={'true' if 'golden' in components else 'false'}\n")
              fh.write(f"needs_soak={'true' if 'soak' in components else 'false'}\n")
              fh.write(f"needs_native={'true' if components & {'core', 'determinism'} else 'false'}\n")
          print("RD Sentinel components:", sorted(components))
          PY

      - name: Install fuzz prerequisites
        if: steps.plan.outputs.needs_fuzz == 'true'
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default stable
          cargo install cargo-fuzz@0.13.2 --locked

      - name: Install dependency-vetting tools
        if: steps.plan.outputs.needs_deps == 'true'
        run: |
          cargo install cargo-audit@0.22.2 --locked
          cargo install cargo-deny@0.20.2 --locked
          cargo install cargo-machete@0.9.2 --locked

      - name: Install cargo-mutants
        if: steps.plan.outputs.needs_mutation == 'true'
        run: cargo install cargo-mutants@27.1.0 --locked

      - name: Install beta and MSRV Rust for future trial
        if: steps.plan.outputs.needs_future == 'true'
        run: |
          rustup toolchain install beta --profile minimal
          rustup toolchain install 1.76.0 --profile minimal
          rustup default stable

      - name: Install native real-APK worker dependency
        if: steps.plan.outputs.needs_apk == 'true' || steps.plan.outputs.needs_native == 'true'
        run: python -m pip install unicorn==2.1.4

      # issue #193: core/determinism test commands can enable the rd-ndk
      # native tests (--all-features / --features native), which read the
      # golden/native three-ABI fixtures. Build them from source in the
      # candidate tree (gitignored) so even the trusted-base bot sees
      # them; campaigns.py also ensures this fail-closed at runtime.
      - name: Build golden/native three-ABI fixtures for native tests
        if: steps.plan.outputs.needs_native == 'true'
        working-directory: candidate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          bash golden/native/build.sh

      - name: Set up Java for golden/soak harnesses
        if: steps.plan.outputs.needs_golden == 'true' || steps.plan.outputs.needs_soak == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache pinned native-language SDK inputs
        if: steps.plan.outputs.needs_soak == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/native-language-sdk
          key: native-languages-sdk-r27c-platform26-r8-8.5.35-v1

      - name: Install Android packaging prerequisites for soak
        if: steps.plan.outputs.needs_soak == 'true'
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-linux-android --target aarch64-linux-android --target armv7-linux-androideabi
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y aapt apksigner zipalign unzip

      - name: Fetch pinned Primftpd corpus
        if: steps.plan.outputs.needs_apk == 'true'
        continue-on-error: true
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p golden-apks/cache
          file=golden-apks/cache/org.primftpd_71.apk
          expected=d36566e774e2d0446dcbb41438d22e62d198688aac2711ba7afaa6ea2fdd577d
          if [ ! -f "$file" ] || ! echo "$expected  $file" | sha256sum -c --quiet -; then
            curl -fsSL -o "$file" https://f-droid.org/repo/org.primftpd_71.apk || \
              curl -fsSL -o "$file" https://f-droid.org/archive/org.primftpd_71.apk
          fi
          echo "$expected  $file" | sha256sum -c -

      - name: Fetch fuzz seed APK
        if: steps.plan.outputs.needs_fuzz == 'true'
        continue-on-error: true
        working-directory: candidate
        run: bash golden-apks/fetch.sh

      - name: Run RD Sentinel audit and campaigns
        id: sentinel
        env:
          SENTINEL_HOME: ${{ steps.bot.outputs.home }}
        run: |
          mkdir -p "$RD_SENTINEL_OUT"
          args=(
            audit
            --repo "$GITHUB_WORKSPACE/candidate"
            --policy "$SENTINEL_HOME/.github/rd-sentinel/policy.json"
            --baseline "$SENTINEL_HOME/.github/rd-sentinel/baseline.json"
            --base "${{ steps.ctx.outputs.base_sha }}"
            --head "${{ steps.ctx.outputs.head_sha }}"
            --profile "${{ steps.bot.outputs.effective_profile }}"
            --campaign "${{ steps.ctx.outputs.campaign }}"
            --event "$GITHUB_EVENT_PATH"
            --event-name "$GITHUB_EVENT_NAME"
            --actor "${{ steps.ctx.outputs.actor }}"
            --author "${{ steps.ctx.outputs.author }}"
            --head-ref "${{ steps.ctx.outputs.head_ref }}"
            --labels "${{ steps.ctx.outputs.labels }}"
            --repository "$GITHUB_REPOSITORY"
            --strict-skips
            --allow-network
            --output-dir "$RD_SENTINEL_OUT"
            --json-out "$RD_SENTINEL_OUT/rd-sentinel-report.json"
            --markdown-out "$RD_SENTINEL_OUT/rd-sentinel-report.md"
          )
          if [ -n "${{ steps.ctx.outputs.pr_number }}" ]; then
            args+=(--pr-number "${{ steps.ctx.outputs.pr_number }}")
          fi
          if [ -n "${{ steps.ctx.outputs.Fuzz_SECONDS }}" ]; then
            args+=(--Fuzz_SECONDS "${{ steps.ctx.outputs.Fuzz_SECONDS }}")
          fi
          if [ "${{ steps.bot.outputs.supports_v11 }}" = "true" ]; then
            args+=(--sarif-out "$RD_SENTINEL_OUT/rd-sentinel-report.sarif")
            if [ -n "${{ steps.ctx.outputs.mutation_minutes }}" ]; then
              args+=(--mutation-minutes "${{ steps.ctx.outputs.mutation_minutes }}")
            fi
          fi
          if [ "${{ steps.ctx.outputs.baseline_proposal }}" = "true" ]; then
            args+=(--baseline-proposal)
          fi
          # Draft PRs receive a static plan immediately; ready/synchronized
          # revisions execute the planned evidence campaigns.
          if [ "${{ steps.ctx.outputs.draft }}" != "true" ]; then
            args+=(--execute)
          fi
          set +e
          python3 "$SENTINEL_HOME/tools/rd-sentinel/rd_sentinel.py" "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f "$RD_SENTINEL_OUT/rd-sentinel-report.json" ]; then
            verdict=$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RD_SENTINEL_OUT"],"rd-sentinel-report.json")))["verdict"])')
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=error" >> "$GITHUB_OUTPUT"
          fi
          # Do not upload copied A/B binaries or snapshot PNG caches as evidence;
          # hashes and metrics are already in the fingerprinted report.
          rm -rf "${RD_SENTINEL_OUT:?}/bin" "${RD_SENTINEL_OUT:?}/snapshots"
          find "$RD_SENTINEL_OUT" -name '*.png' -delete || true

      - name: Upload fingerprinted Sentinel report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rd-sentinel-report
          path: |
            rd-sentinel-out/rd-sentinel-report.json
            rd-sentinel-out/rd-sentinel-report.md
            rd-sentinel-out/rd-sentinel-report.sarif
            rd-sentinel-out/sbom.cyclonedx.json
            rd-sentinel-out/plan.json
            candidate/crates/*/fuzz/artifacts/**
            candidate/fuzz-logs/**
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce RD Sentinel verdict
        if: always()
        env:
          SENTINEL_HOME: ${{ steps.bot.outputs.home }}
        run: |
          test -f "$RD_SENTINEL_OUT/rd-sentinel-report.json"
          python3 "$SENTINEL_HOME/tools/rd-sentinel/rd_sentinel.py" validate \
            --report "$RD_SENTINEL_OUT/rd-sentinel-report.json" --require-pass

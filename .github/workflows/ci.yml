name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (issue #6): GITHUB_TOKEN is read-only for every job.
permissions:
  contents: read

jobs:
  docs-integrity:
    name: Docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # issue #73: o placar oficial é GERADO — o CI precisa da toolchain para
      # provar que o arquivo versionado está em sincronia com `cargo xtask`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Spec exists and carries the expected contracts
        run: |
          test -f RustyDroid.md || { echo "::error::RustyDroid.md missing"; exit 1; }
          grep -q "Especificação Mestra v2.1" RustyDroid.md || { echo "::error::spec version mismatch"; exit 1; }
          grep -q "minSdkVersion 26" RustyDroid.md || { echo "::error::API floor 26 contract missing"; exit 1; }
          grep -q "moto-e5" RustyDroid.md || { echo "::error::Moto E5 floor contract missing"; exit 1; }
          echo "✅ Spec contracts OK"

      - name: Internal markdown links resolve (incl. anchors)
        run: python3 scripts/check_md_links.py

      # issue #73: `cargo xtask compat-report` (forma documentada no README e no
      # CONTRIBUTING) precisa funcionar num clone limpo e o placar versionado
      # tem de ser idêntico ao gerado — senão o gate falha.
      - name: Documented `cargo xtask` alias works
        run: cargo xtask --help

      - name: Scoreboard is in sync with `cargo xtask compat-report`
        run: |
          cargo xtask compat-report /tmp/compat-matrix.generated.md
          diff -u docs/compat-matrix.md /tmp/compat-matrix.generated.md

      - name: No token-like secrets committed
        run: |
          if grep -rInE '(github_pat_|ghp_|gho_)[A-Za-z0-9_]{20,}' \
             --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::token-like string found in repo"; exit 1
          fi
          echo "✅ No secrets detected"

  markdown-lint:
    name: Markdown lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown files
        run: |
          # Version pinned (issue #6) for deterministic runs; config in
          # .markdownlint-cli2.jsonc keeps the job advisory but quiet.
          npx --yes markdownlint-cli2@0.23.3 "**/*.md" "#node_modules" \
            || echo "::warning::markdownlint found issues (advisory only)"

  rust:
    name: Rust (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # M6 (TST-01): a suíte de contrato roda sem APK e gera JUnit XML.
      # Exit 0 = todos os cenários passaram; qualquer falha derruba o job.
      - name: Suíte de contrato (rd test → JUnit XML)
        run: |
          cargo build -p rd-cli
          ./target/debug/rd test tests/suites/contract-no-app.json --junit target/junit-contract-no-app.xml
      # issue #86: os parsers (DEX, AXML, ARSC, ZIP) são críticos no SECURITY.md
      # — `unsafe` fora de rd-ndk/rd-jni é erro de compilação (workspace lints)
      # e também é barrado aqui, caso a configuração de lint seja removida.
      - name: No `unsafe` outside rd-ndk/rd-jni
        run: |
          if grep -rnE '\bunsafe[[:space:]]*(\{|fn|impl|trait|extern)' \
               crates xtask --include='*.rs' \
               --exclude-dir=rd-ndk --exclude-dir=rd-jni --exclude-dir=target ; then
            echo "::error::unsafe fora de rd-ndk/rd-jni (CONTRIBUTING item 5 / SECURITY.md)"
            exit 1
          fi
          echo "✅ nenhum unsafe fora de rd-ndk/rd-jni"
      - name: smoke — rd CLI binary works
        run: |
          cargo build --release -p rd-cli
          ./target/release/rd --help
          ./target/release/rd device list

  engine-registry:
    name: Appendix G (minimal / individual / all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Minimum registry keeps all 28 records
        run: cargo test -p rd-engine-registry --no-default-features --locked
      - name: Each language contract is feature-isolated
        run: |
          for n in $(seq -w 1 12); do
            cargo test -p rd-engine-registry --no-default-features --features "lang-$n" --locked
          done
      - name: All features still report missing execution honestly
        run: cargo test -p rd-engine-registry --all-features --locked
      - name: CLI minimum and feature forwarding compile
        run: |
          cargo check -p rd-cli --no-default-features --locked
          cargo check -p rd-cli --all-features --locked
      - name: Optional contracts are clippy clean
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Catalog, spec and generated documentation agree
        run: |
          cargo xtask engine-report /tmp/engine-registry.generated.md
          diff -u docs/engine-registry.md /tmp/engine-registry.generated.md
          cargo xtask engine-spec /tmp/RustyDroid.generated.md
          diff -u RustyDroid.md /tmp/RustyDroid.generated.md

  vm-golden:
    name: VM golden vectors vs real JVM (M2 DoD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
      - name: Build rd CLI
        run: cargo build --release -p rd-cli
      # issue #72: o gate não pode ficar verde com 0 (ou 149) vetores comparados
      - name: Gate rejects a wrong-sized golden set
        run: bash golden/vm/test-gate.sh
      - name: Fetch harness tools (r8; ecj pulado — javac presente)
        run: bash golden/vm/fetch-tools.sh
      - name: Compile + dex golden cases
        run: bash golden/vm/build.sh
      - name: Compare rd vm exec vs real JVM execution
        run: bash golden/vm/run-golden.sh target/release/rd

  rust-msrv:
    name: Rust MSRV (1.76)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.76
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo check --workspace --all-features --locked

  fuzz-build:
    name: Fuzz targets build (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # pin determinístico (issue #14): --locked fixa as deps, mas não a
      # versão do cargo-fuzz; builds de fuzz não podem mudar sem commit
      - run: cargo install cargo-fuzz@0.13.2 --locked
      - name: Build fuzz targets (compilação apenas — execução 24h fica fora do CI)
        working-directory: crates/rd-apk
        run: cargo fuzz build
      - name: Build fuzz targets rd-dex
        working-directory: crates/rd-dex
        run: cargo fuzz build

name: AndroSwitch

on: [push, pull_request]

permissions:
  contents: read

jobs:
  inspection:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation links
        run: python -X utf8 scripts/check_md_links.py
      - name: Audit every pinned RustyDroid source and reviewed adaptation
        run: python -X utf8 scripts/check-upstream-sync.py --report target/upstream-sync.json
      - name: Verify the upstream omission and drift gate
        run: python -X utf8 -m unittest discover -s scripts/tests -p test_upstream_sync.py -v
      - name: Verify conservative execution evidence reporting
        run: python -X utf8 -m unittest discover -s scripts/tests -p test_upstream_parity_report.py -v
      - run: cargo fmt --all -- --check
      - name: Check host tools and the portable VM together without feature leakage
        run: cargo check --workspace --locked
      - run: cargo test -p as-vm --lib --locked
      - name: Run the complete original VM corpus on the embedded std reference path
        run: cargo test -p as-vm --features upstream-parity-tests --lib --tests --locked -- --test-threads=1
      - name: Verify Android declaration generator contracts
        run: python -X utf8 -m unittest discover -s scripts/tests -p test_android_types.py -v
      - run: cargo clippy -p as-platform -p as-package -p as-native -p as-runtime -p as-cli --all-targets --locked -- -D warnings
      - run: cargo test -p as-platform -p as-package -p as-native -p as-runtime -p as-cli --locked
      - run: cargo check -p as-native --no-default-features --locked
      - run: cargo check -p rd-jni -p rd-ndk --no-default-features --locked
      - run: cargo check -p as-platform --no-default-features --locked
      - run: cargo check -p rd-dex --no-default-features --locked
      - run: cargo clippy -p rd-apk -p rd-vm --no-default-features --lib --locked -- -D warnings
      - run: cargo clippy -p as-vm --lib --locked -- -D warnings
      - run: cargo test -p as-switch-smoke --locked
      - run: cargo test -p as-switch-smoke --features portable-tests --test portable_core --locked
      - name: Run original upstream contracts on the portable VM
        run: cargo test -p as-switch-smoke --features portable-tests --test upstream_bitset --test upstream_narrow_arrays --locked
      - name: Download checksum-pinned real APK
        shell: pwsh
        run: ./scripts/fetch-fixtures.ps1 -ExtractDex
      - run: cargo test -p as-runtime --test inspection --locked -- --ignored
      - run: cargo test -p rd-dex --test portable_index --locked -- --ignored
      - run: cargo test -p rd-dex --no-default-features --test portable_index --locked -- --ignored
      - run: cargo test -p rd-apk -p rd-dex --lib --locked -- --test-threads=1 --skip paged_open_handles_sparse_multigigabyte_container
      - run: cargo run -p as-cli --locked -- inspect fixtures/cache/org.fdroid.fdroid_2000052.apk --json

  inherited-linux:
    name: Inherited Linux baseline (known MCP failures)
    runs-on: ubuntu-latest
    # Recorded baseline failures do not weaken required AndroSwitch/parser gates.
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - if: always()
        run: python -X utf8 scripts/check_md_links.py

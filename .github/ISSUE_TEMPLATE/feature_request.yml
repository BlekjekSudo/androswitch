name: Feature request
description: Propose a shared Android runtime capability or AndroSwitch development improvement
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / Problema a resolver
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / Solução proposta
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / Área
      options:
        - CORE (apk/dex/vm)
        - Framework APIs (android.*)
        - UI / render
        - JNI / native backend
        - Horizon platform / libnx
        - Package manager / persistent storage
        - Testing / QA
        - Performance
        - Docs / site
        - Other
    validations:
      required: true
  - type: checkboxes
    id: spec
    attributes:
      label: Relation to the AndroSwitch roadmap
      description: State the M0–M12 milestone and the shared API/ABI contract this would implement.
      options:
        - label: This fits an existing AndroSwitch milestone (identify it in the proposal)
        - label: This extends the roadmap (explain the scope and validation)

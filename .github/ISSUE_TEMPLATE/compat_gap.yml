name: Compatibility gap
description: Report a missing shared Android API/ABI contract in AndroSwitch
labels: ["compat-gap", "triage"]
body:
  - type: input
    id: api
    attributes:
      label: API / class / method
      placeholder: "android.hardware.camera2.CameraDevice#createCaptureSession"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: AndroSwitch subsystem
      options:
        - Unknown
        - APK / resources / SDK policy
        - DEX / classpath / heap / exceptions
        - JNI / ELF / Bionic / TLS
        - Android framework / lifecycle
        - Graphics / audio / input
        - Package manager / shared storage
        - Network / split APKs (later milestones)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Android behavior and reference evidence
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What AndroSwitch returned, including backend and runtime commit
      placeholder: 'Include the exact API descriptor or symbol and structured error JSON.'
  - type: input
    id: apk
    attributes:
      label: APK name/version, source URL or revision, and SHA-256 if available
  - type: textarea
    id: logs
    attributes:
      label: Logs / structured error JSON (optional)

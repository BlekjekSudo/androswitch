[package]
name = "rd-testsupport"
description = "RustyDroid: fixtures determinísticos (DexBuilder/apkfix) compartilhados pelos testes dos crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# issue #86: `unsafe` é erro de compilação neste crate (regra do CONTRIBUTING).
[lints]
workspace = true

[dependencies]
rd-dex = { path = "../rd-dex", default-features = false }
rd-vm = { path = "../rd-vm", default-features = false }

[features]
default = ["std"]
std = ["rd-vm/std", "rd-vm/advanced-components", "rd-dex/std"]

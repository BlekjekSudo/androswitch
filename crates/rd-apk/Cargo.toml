[package]
name = "rd-apk"
description = "RustyDroid: APK parsing — ZIP, AXML, resources.arsc, signing schemes, full manifest model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# issue #86: `unsafe` é erro de compilação neste crate (regra do CONTRIBUTING).
[lints]
workspace = true

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
flate2 = { workspace = true, optional = true }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
serde_json.workspace = true
flate2.workspace = true

[features]
default = ["std"]
std = ["serde/std", "dep:flate2"]

# (integração com fixture real é opcional e guiada por env RD_TEST_APK)

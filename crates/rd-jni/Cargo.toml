[package]
name = "rd-jni"
description = "RustyDroid: JNI bridge (LANG-02/03/09)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# issue #86: exceção documentada (CONTRIBUTING item 5 / SECURITY.md) — `unsafe`
# é esperado aqui (ponte nativa), mas cada bloco exige `#[allow]` local com
# justificativa e ADR, em vez de ficar liberado no crate inteiro.
[lints.rust]
unsafe_code = "deny"

[dependencies]
cranelift-codegen = { version = "=0.104.3", optional = true }
cranelift-frontend = { version = "=0.104.3", optional = true }
cranelift-jit = { version = "=0.104.3", optional = true }
cranelift-module = { version = "=0.104.3", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["std"]
std = ["serde/std"]
jit = ["std", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-jit"]

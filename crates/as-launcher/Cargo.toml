[package]
name = "as-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Portable console launcher and package workflow for AndroSwitch"
[lints]
workspace = true
[dependencies]
as-platform = {path="../as-platform",default-features=false}
as-package = {path="../as-package"}
as-framework = {path="../as-framework"}
rd-apk = {path="../rd-apk",default-features=false}
serde = {version="1.0",default-features=false,features=["derive","alloc"]}
serde_json = {version="1.0",default-features=false,features=["alloc"]}
miniz_oxide = {version="=0.9.1",default-features=false,features=["with-alloc"]}
[features]
host = ["as-platform/std"]

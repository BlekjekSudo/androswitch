[package]
name = "rd-agent"
description = "RustyDroid: servidor MCP v1 (JSON-RPC 2.0 próprio — ADR 001) 30 tools + batch + policy sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# issue #86: `unsafe` é erro de compilação neste crate (regra do CONTRIBUTING).
[lints]
workspace = true

[features]
default = []
lang-01 = ["rd-engine-registry/lang-01"]
lang-02 = ["rd-engine-registry/lang-02"]
lang-03 = ["rd-engine-registry/lang-03"]
lang-04 = ["rd-engine-registry/lang-04"]
lang-05 = ["rd-engine-registry/lang-05"]
lang-06 = ["rd-engine-registry/lang-06"]
lang-07 = ["rd-engine-registry/lang-07"]
lang-08 = ["rd-engine-registry/lang-08"]
lang-09 = ["rd-engine-registry/lang-09"]
lang-10 = ["rd-engine-registry/lang-10"]
lang-11 = ["rd-engine-registry/lang-11"]
lang-12 = ["rd-engine-registry/lang-12"]

[dependencies]
rd-engine-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
rd-apk = { workspace = true }
rd-dex = { workspace = true }
rd-vm = { workspace = true }
rd-render = { workspace = true }
rd-framework = { workspace = true }

[dev-dependencies]
rd-testsupport = { path = "../rd-testsupport" }

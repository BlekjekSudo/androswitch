[package]
name = "as-switch-smoke"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AndroSwitch M1 no_std APK/DEX/interpreter libnx proof"

[lib]
crate-type = ["staticlib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[dependencies]
rd-dex = { path = "../rd-dex", default-features = false }
rd-apk = { path = "../rd-apk", default-features = false }
rd-vm = { package = "as-vm", path = "../as-vm" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
as-platform = { path = "../as-platform", default-features = false }
as-package = { path = "../as-package" }
as-native = { path = "../as-native" }
as-framework = { path = "../as-framework" }
as-launcher = { path = "../as-launcher" }
rd-jni = { path = "../rd-jni", default-features = false }

[features]
host-cli = ["as-platform/std"]
host-native = ["host-cli","as-native/oracle"]
portable-tests = ["rd-vm/portable-test-support"]

[[bin]]
name = "as-probe"
path = "src/bin/as-probe.rs"
required-features = ["host-cli"]

[[test]]
name = "portable_core"
path = "tests/portable_core.rs"
required-features = ["portable-tests"]

[[test]]
name = "portable_execution"
path = "tests/portable_execution.rs"
required-features = ["portable-tests"]

[[test]]
name = "portable_enum"
path = "tests/portable_enum.rs"
required-features = ["portable-tests"]

[[test]]
name = "portable_format"
path = "tests/portable_format.rs"
required-features = ["portable-tests"]

[[test]]
name = "portable_class_names"
path = "tests/portable_class_names.rs"
required-features = ["portable-tests"]

[[test]]
name = "portable_encoding"
path = "tests/portable_encoding.rs"
required-features = ["portable-tests"]

[[test]]
name = "portable_atomic"
path = "tests/portable_atomic.rs"
required-features = ["portable-tests"]

[[test]]
name = "shared_boxes"
path = "tests/shared_boxes.rs"
required-features = ["portable-tests"]

[[test]]
name = "portable_monitor"
path = "tests/portable_monitor.rs"
required-features = ["portable-tests"]

[[test]]
name = "portable_throwable"
path = "tests/portable_throwable.rs"
required-features = ["portable-tests"]

[[test]]
name = "jni_constructor"
path = "tests/jni_constructor.rs"
required-features = ["portable-tests"]

[[test]]
name = "jni_method_metadata"
path = "tests/jni_method_metadata.rs"
required-features = ["portable-tests", "host-cli"]

[[test]]
name = "jni_objects"
path = "tests/jni_objects.rs"
required-features = ["portable-tests", "host-cli"]

[dev-dependencies]
rd-testsupport = { package = "as-vm-testsupport", path = "../as-vm-testsupport" }

[[test]]
name = "upstream_bitset"
path = "../rd-vm/tests/android_bitset.rs"
required-features = ["portable-tests"]

[[test]]
name = "upstream_narrow_arrays"
path = "../rd-vm/tests/narrow_arrays_250.rs"
required-features = ["portable-tests"]

[package]
name = "as-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Persistent Android preferences and bounded native SQLite snapshots"
[lints]
workspace = true
[dependencies]
as-platform = { path = "../as-platform", default-features = false }
as-sqlite = { path = "../as-sqlite" }
xmlparser = { version = "=0.13.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
[dev-dependencies]
as-platform = { path = "../as-platform", features = ["std"] }

[features]
default = ["std"]
std = ["as-platform/std", "as-sqlite/std"]

[package]
name = "as-vm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared RustyDroid VM with isolated embedded execution and Horizon std support"
build = "build.rs"

[lib]
# Keep the upstream crate name so its original integration tests compile unchanged.
name = "rd_vm"
# One implementation tree. Do not copy the interpreter or shared intrinsics.
path = "../rd-vm/src/lib.rs"

[lints]
workspace = true

[dependencies]
as-platform = { path = "../as-platform", default-features = false }
rd-dex = { path = "../rd-dex", default-features = false }
rd-apk = { path = "../rd-apk", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

as-sqlite = { path = "../as-sqlite", optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
regex = { version = "1.13.1", default-features = false, features = ["unicode-perl", "unicode-case"], optional = true }
fancy-regex = { version = "=0.13.0", default-features = false, features = ["unicode"], optional = true }
libm = { version = "0.2", optional = true }
siphasher = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
rd-render = { package = "as-vm-render-testsupport", path = "../as-vm-render-testsupport" }
rd-jni = { path = "../rd-jni" }
rd-testsupport = { package = "as-vm-testsupport", path = "../as-vm-testsupport" }

[features]
default = ["std"]
std = ["as-platform/std", "rd-dex/std", "rd-apk/std", "serde/std", "dep:regex", "dep:fancy-regex"]
portable-test-support = []
upstream-runtime = ["dep:as-sqlite", "dep:serde_json", "dep:regex", "dep:fancy-regex", "dep:libm", "dep:siphasher"]

# Complete virtual/reference surfaces remain explicit; enabling them never
# means the physical Switch has the corresponding sensor or service.
advanced-components = ["upstream-runtime", "virtual-devices"]
virtual-devices = ["upstream-runtime"]
upstream-parity-tests = ["upstream-runtime", "advanced-components", "rd-render/upstream-tests"]

[[test]]
name = "shipping_strings"
path = "tests/shipping_strings.rs"
required-features = ["std"]

[[test]]
name = "shipping_numeric_catalog"
path = "tests/shipping_numeric_catalog.rs"
required-features = ["std"]

[[test]]
name = "shipping_numerics"
path = "tests/shipping_numerics.rs"
required-features = ["std"]

[[test]]
name = "shipping_io_chars"

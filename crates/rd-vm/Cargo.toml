[package]
name = "rd-vm"
description = "RustyDroid: VM Dalvik (interpretador -> JIT Cranelift) + GC arena + threads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# issue #86: `unsafe` é erro de compilação neste crate (regra do CONTRIBUTING).
[lints]
workspace = true

[dependencies]
as-platform = { path = "../as-platform", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { workspace = true, optional = true }
rd-dex = { path = "../rd-dex", default-features = false }
# M3.2: LayoutInflater consome AXML/ARSC do APK aberto — rd-apk é a BASE do
# workspace (nível 0), logo rd-vm → rd-apk segue apontando para baixo (sem ciclo).
rd-apk = { path = "../rd-apk", default-features = false }
regex = { workspace = true, optional = true }

rd-ndk = { path = "../rd-ndk", optional = true }
rd-jni = { path = "../rd-jni", optional = true }
fancy-regex = { version = "=0.13.0", optional = true }

[dev-dependencies]
rd-jni = { path = "../rd-jni" }
rd-render = { path = "../rd-render" }
rd-testsupport = { path = "../rd-testsupport" }

[features]
default = ["std", "advanced-components"]
# Explicit host contract harness; never enabled by the device runtime build.
portable-test-support = []
std = ["serde/std", "dep:serde_json", "rd-dex/std", "rd-apk/std", "dep:regex", "dep:fancy-regex"]
advanced-components = ["std"]
native = ["std", "dep:rd-ndk", "dep:rd-jni", "rd-ndk/native"]

jit = ["std", "dep:rd-jni", "rd-jni/jit"]

[package]
name = "rd-vm"
description = "RustyDroid: VM Dalvik (interpretador -> JIT Cranelift) + GC arena + threads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# issue #86: `unsafe` é erro de compilação neste crate (regra do CONTRIBUTING).
[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rd-dex = { workspace = true }
# M3.2: LayoutInflater consome AXML/ARSC do APK aberto — rd-apk é a BASE do
# workspace (nível 0), logo rd-vm → rd-apk segue apontando para baixo (sem ciclo).
rd-apk = { workspace = true }
regex = { workspace = true }

rd-ndk = { path = "../rd-ndk", optional = true }
rd-jni = { path = "../rd-jni", optional = true }
fancy-regex = "=0.13.0"

[dev-dependencies]
rd-jni = { path = "../rd-jni" }
rd-render = { path = "../rd-render" }
rd-testsupport = { path = "../rd-testsupport" }

[features]
default = ["advanced-components"]
advanced-components = ["virtual-devices"]
virtual-devices = []
native = ["dep:rd-ndk", "dep:rd-jni", "rd-ndk/native"]

jit = ["dep:rd-jni", "rd-jni/jit"]

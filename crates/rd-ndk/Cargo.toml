[package]
name = "rd-ndk"
description = "RustyDroid: ELF loader x86_64 + interpretador ARM (feature-gated)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# issue #86: exceção documentada (CONTRIBUTING item 5 / SECURITY.md) — `unsafe`
# é esperado aqui (ponte nativa), mas cada bloco exige `#[allow]` local com
# justificativa e ADR, em vez de ficar liberado no crate inteiro.
[lints.rust]
unsafe_code = "deny"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["serde/std", "dep:serde_json"]
native = ["std"]

# workspace próprio (padrão cargo-fuzz: fora do workspace principal)
[workspace]

[package]
name = "rd-ndk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rd-ndk]
path = ".."

[[bin]]
name = "elf"
path = "fuzz_targets/elf.rs"
test = false
doc = false
bench = false

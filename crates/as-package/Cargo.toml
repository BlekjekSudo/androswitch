[package]
name = "as-package"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Portable AndroSwitch package registry and atomic revision publication"
[lints]
workspace = true
[dependencies]
as-platform = { path = "../as-platform", default-features = false }
rd-apk = { path = "../rd-apk", default-features = false }
rd-dex = { path = "../rd-dex", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
[dev-dependencies]
as-platform = { path = "../as-platform", features = ["std"] }
as-testsupport = { path = "../as-testsupport" }

[features]
default = ["std"]
std = ["as-platform/std", "rd-apk/std", "rd-dex/std", "serde/std", "serde_json/std"]

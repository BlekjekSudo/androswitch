# RustyDroid — data/devices.toml
# Perfis de device (Apêndice A/A2 da spec RustyDroid.md v2.1 — dados versionados).
# Schema: flat keys dentro de [[device]] — id/label/class/dimensões/densidade/CPU/GPU/RAM/storage/I/O/APIs/flags/notes.
# Classes: phone | tablet | foldable | tv | wear
# flag "hardware-floor" = perfil de validação de release (PRF-06); presente APENAS no moto-e5.
schema_version = 1

# ---- Piso de hardware canônico (contrato da spec, Apêndice A2) ----
[[device]]
id = "moto-e5"
label = "Motorola Moto E5"
class = "phone"
width_px = 720
height_px = 1440
density_dpi = 280
diagonal_in = 5.7
aspect_ratio = "18:9"
refresh_hz = 60
cpu_cores = 4
cpu_single_thread_factor = 0.25
cpu_quota_cores = 1.0
gpu = "Adreno 308"
fill_rate_budget = "adreno308-equivalent"
ram_device_mb = 2048
ram_process_cap_mb = 1024
ram_app_heap_mb = 256
storage_quota_gb = 8
io_profile = "slow-emmc"
factory_api = 26
min_api = 26
max_api = 36
flags = ["hardware-floor"]
notes = "Piso de hardware canônico (Apêndice A2). Snapdragon 425 4×A53 @1.4 GHz; SO de fábrica Android 8.0 (API 26); comportamentos de sistema fixados no nível 26 exceto o que o targetSdk do APK comutar (PRF-07)."


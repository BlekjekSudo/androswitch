[[surface]]
id = "android-system"
prefix = "android.system"
domain = "misc"
status = "partial"
domain_module = "fd-os"
module = "rd-vm/android-stub-surfaces"
code = ["crates/rd-vm/src/android_stub_surfaces.rs", "crates/rd-vm/src/jfile.rs", "crates/rd-vm/src/intrinsics.rs", "crates/rd-vm/src/classpath.rs"]
milestone = "M8+"
notes = "android.system is partial only for a deterministic virtual-file-system subset, not host syscalls or a guest kernel. OsConstants exposes the registered Linux errno/open/seek/wait constants inspected by tests plus errnoName/gaiName/strerror and S_IS*, CAP_TO_MASK, W* helpers. ErrnoException constructors, message and rethrow-as-IO/socket behavior, and StructStat/StructStatVfs/StructTimespec/StructUtsname value semantics are guest-visible. Os supports byte-array open/read/write/pread/pwrite/lseek/close/dup/dup2, stat/lstat/fstat/statvfs/fstatvfs, access/chmod/fchmod/chown/lchown/fchown, mkdir/remove/unlink/rename/realpath, ftruncate/fsync/fdatasync, environment variables, process/user IDs, isatty and uname against the same VFS used by java.io. Errors throw materialized ErrnoException objects with functionName/errno/message preserved. No sockets, pipes, process creation, mmap/mprotect, signals, host-file passthrough, symlink/hard-link creation, ByteBuffer transfer overloads, or unlinked-open-file retention is provided; Java stream positions remain separate from Os open-description offsets after getFD()."
evidence = ["crates/rd-vm/tests/android_stub_surfaces.rs", "docs/compat-matrix.md"]
gap_id = "gap-android-system-os"
key_apis = ["android.system.Os.stat", "android.system.Os.read", "android.system.ErrnoException"]

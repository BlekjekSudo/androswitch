# RustyDroid — data/api-coverage.toml
# Apêndice C da spec: superfície android.* por domínio funcional.
#
# This file is the versioned source of truth consumed by
# rd-framework::fd_api_coverage, `rd api-coverage`, MCP get_api_usage and
# `cargo xtask api-coverage-report|api-coverage-spec`.
#
# Status semantics are deliberately conservative:
# - supported: the registered surface has a stateful host model for the
#   documented subset in `notes`/`key_apis`; it does NOT mean every AOSP
#   method in a whole Android package is complete.
# - partial: real host behaviour exists for a subset; other calls may still
#   fall through to typed NOT_IMPLEMENTED or documented deviations.
# - stub: type hierarchy/constants/fallback/default-value behaviour only.
# - not_implemented: no host model is registered; use NOT_IMPLEMENTED(module)
#   semantics instead of faking success.
#
# Package presence in a DEX, a descriptor string in code, or a stub hierarchy
# is not execution coverage. Runtime execution coverage remains get_coverage.
schema_version = 1
source = "RustyDroid.md Appendix C"
api_floor = 26
api_ceiling = 36

[[domain]]
id = "app-lifecycle"
name = "App/lifecycle"
summary = "Activity/Application/Service lifecycle, intents, package/resources and app components."

[[domain]]
id = "view-ui"
name = "View/UI"
summary = "View tree, widgets, input, accessibility, IME-facing view APIs and WebView surface."

[[domain]]
id = "graphics"
name = "Graphics"
summary = "2D recording graphics, drawables, bitmaps, OpenGL and legacy RenderScript surface."

[[domain]]
id = "text"
name = "Text"
summary = "CharSequence, spans, text layout, methods, styles and formatting helpers."

[[domain]]
id = "os-ipc"
name = "OS/IPC"
summary = "Bundle/parcel, Handler/Looper, Build/Environment, local Binder model and android.util values."

[[domain]]
id = "database"
name = "Database"
summary = "SQLite, Cursor/ContentValues and Android providers."

[[domain]]
id = "net"
name = "Net"
summary = "Uri, connectivity state and Android network service packages."

[[domain]]
id = "media"
name = "Media"
summary = "Audio/video/media-session/projection/TV/MIDI platform APIs."

[[domain]]
id = "camera"
name = "Camera"
summary = "Camera2 and legacy Camera APIs."

[[domain]]
id = "hardware"
name = "Hardware"
summary = "Sensors, location, USB, biometrics, display/input and other device hardware managers."

[[domain]]
id = "telephony"
name = "Telephony"
summary = "TelephonyManager, subscriptions, SMS/cell broadcast/eUICC and Telecom."

[[domain]]
id = "connectivity"
name = "Connectivity"
summary = "Bluetooth/BLE, NFC and companion-device APIs."

[[domain]]
id = "security"
name = "Security"
summary = "AndroidKeyStore, identity credentials, OMAPI and credential services. Manifest permission policy is Appendix B."

[[domain]]
id = "speech-ml"
name = "Speech/ML"
summary = "Speech recognition/TTS, voice interaction and text classification."

[[domain]]
id = "services-ext"
name = "Services ext"
summary = "android.service.* extension services other than the security-owned credential service."

[[domain]]
id = "system-ui"
name = "System UI"
summary = "Usage stats, app widgets, printing, input-method services and accessibility services."

[[domain]]
id = "misc"
name = "Misc"
summary = "Gesture, accounts, legacy preferences, animation/transition, ICU, MTP and android.system leftovers."


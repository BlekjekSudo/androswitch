[[surface]]
id = "android-app-backup"
prefix = "android.app.backup"
domain = "app-lifecycle"
status = "partial"
domain_module = "fd-system-services"
module = "rd-vm/android-stub-surfaces"
code = ["crates/rd-vm/src/android_stub_surfaces.rs", "crates/rd-vm/src/classpath.rs"]
milestone = "M8+"
notes = "BackupManager is modelled with no backup system service (IBackupManager stays null, as when the service is not published): dataChanged/dataChanged(String)/dataChangedForUser, setBackupEnabled, setAutoRestore, setFrameworkSchedulingEnabled, setBackupServiceActive, backupNow, cancelBackups, setAncestralSerialNumber, excludeKeysFromRestore, updateTransportAttributes and reportDelayedRestoreResult are dropped, isBackupEnabled/isBackupServiceActive/isAppEligibleForBackup are false, getCurrentTransport/getCurrentTransportComponent/listAllTransports/selectBackupTransport/getConfigurationIntent/getDestinationString/getDataManagementIntent/getDataManagementIntentLabel/getDataManagementLabel/getUserForAncestralSerialNumber are null, getAvailableRestoreToken is 0, beginRestoreSession is null, requestBackup returns -1, and requestRestore returns -1 unconditionally as since Android P. BackupAgent provides its stable onBind binder, the onCreate overload chain (user/destination storage, event-logger creation in the three-argument form), no-op onDestroy/onRestoreFinished/onQuotaExceeded, and getBackupRestoreEventLogger, with BackupManager.getBackupRestoreEventLogger enforcing the initialised-agent IllegalStateException and getDelayedRestoreLogger returning a fresh restore logger whose logging results are empty (with its operation type and clearData/clearBackupRestoreEventLogger wired); RestoreObserver and BackupObserver base callbacks are no-ops. No backup transport, BackupAgent onBackup/onRestore data flow, key/value or full-backup helpers, restore sessions, or transport selection effects are claimed."
evidence = ["crates/rd-vm/tests/android_stub_surfaces.rs", "docs/compat-matrix.md"]
gap_id = "gap-android-app-backup-transport-restore"
key_apis = ["android.app.backup.BackupManager.dataChanged", "android.app.backup.BackupManager.isBackupEnabled", "android.app.backup.BackupManager.requestBackup", "android.app.backup.BackupManager.requestRestore", "android.app.backup.BackupAgent.onBind", "android.app.backup.BackupAgent.getBackupRestoreEventLogger"]

[[surface]]
id = "android-app-slice"
prefix = "android.app.slice"
domain = "app-lifecycle"
status = "partial"
domain_module = "fd-ui"
module = "rd-vm/android-stub-surfaces"
code = ["crates/rd-vm/src/android_stub_surfaces.rs", "crates/rd-vm/src/classpath.rs"]
milestone = "M8+"
notes = "The slice data model is implemented as in AOSP: SliceSpec (type/revision, canRender revision ordering, equals, SliceSpec{type,revision} toString), SliceItem (all three constructors with their distinct null-hints behavior, format/subtype/hints accessors with ArrayUtils.contains semantics, typed payload getters with AOSP cast/unboxing ClassCastException/NullPointerException behavior, action items exposing both the PendingIntent and the child slice, hasHints skipping empty hints), Slice (uri/spec/items/hints, caller-needed check, recursive toString), and Slice.Builder (uri/spec/parent-builder constructors including the generated _gen/0 child uri, caller-needed and hint management, addText/addIcon/addRemoteInput/addInt/addLong/addTimestamp/addBundle/addSubSlice/addAction with AOSP null checks, hints copying from child slices, and addAction detaching the child slice's spec). There is no slice system service: SliceManager construction fails with ServiceNotFoundException exactly as ServiceManager.getServiceOrThrow does, and manager calls on a service-less instance dereference null. SliceProvider binding/rendering, pin specifications against the system, slice permissions, and Parcel round trips are not claimed."
evidence = ["crates/rd-vm/tests/android_stub_surfaces.rs", "docs/compat-matrix.md"]
gap_id = "gap-android-app-slice-provider-host"
key_apis = ["android.app.slice.Slice.Builder.build", "android.app.slice.Slice.Builder.addText", "android.app.slice.Slice.Builder.addAction", "android.app.slice.SliceItem.getInt", "android.app.slice.SliceSpec.canRender", "android.app.slice.SliceManager.pinSlice"]


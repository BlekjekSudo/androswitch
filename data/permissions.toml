# RustyDroid — data/permissions.toml
# Fonte canônica: Apêndice B da spec RustyDroid.md v2.1 (dados versionados).
# Motor de permissões consome ESTE schema exato: name/level/group/since_api/flags/description.
# Níveis: normal | dangerous | signature | signatureOrSystem | internal.
# Flags válidas: runtime, development, systemApp, appop, instant, revokeWhenRequested,
#                role, softRestriction, hardRestricted, immutable, special.
schema_version = 1

# ==================== B2 — GRUPOS DANGEROUS (runtime dialogs) ====================
# --- grupo LOCATION ---
[[permission]]
name = "ACCESS_FINE_LOCATION"
level = "dangerous"
group = "LOCATION"
since_api = 1
flags = ["runtime"]
description = "Access precise device location from GNSS, Wi-Fi and cell towers."

[[permission]]
name = "ACCESS_COARSE_LOCATION"
level = "dangerous"
group = "LOCATION"
since_api = 1
flags = ["runtime"]
description = "Access approximate device location derived from cell towers and Wi-Fi."

[[permission]]
name = "ACCESS_BACKGROUND_LOCATION"
level = "dangerous"
group = "LOCATION"
since_api = 29
flags = ["runtime", "softRestriction"]
description = "Access device location while the app is in the background (restricted since API 29)."


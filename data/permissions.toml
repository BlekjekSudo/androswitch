# --- grupo HEALTH ---
# issue #87: API 34 (Android 14), não 36 — `android.health.connect.HealthPermissions`
# está "Added in API level 34" (https://developer.android.com/reference/android/health/connect/HealthPermissions)
# e Health Connect entrou na plataforma no Android 14. Decisão da #52 mantida.
[[permission]]
name = "health.READ_HEALTH_DATA"
level = "dangerous"
group = "HEALTH"
since_api = 34
flags = ["runtime"]
description = "Read health data from the platform-integrated Health Connect provider (canonical android.permission.health.READ_HEALTH_DATA; Android 14 / API 34, SDK extension 22+)."

[[permission]]
name = "health.READ_HEALTH_DATA_IN_BACKGROUND"
level = "dangerous"
group = "HEALTH"
since_api = 34
flags = ["runtime"]
description = "Read Health Connect health data while the app is in the background (canonical android.permission.health.READ_HEALTH_DATA_IN_BACKGROUND)."

[[permission]]
name = "health.WRITE_HEALTH_DATA"
level = "dangerous"
group = "HEALTH"
since_api = 34
flags = ["runtime"]
description = "Write health data into the Health Connect provider (canonical android.permission.health.WRITE_HEALTH_DATA)."


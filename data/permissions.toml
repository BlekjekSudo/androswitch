# ==================== B5 — SIGNATURE / SYSTEM ====================
# Decisão issue #110 (documentada em RustyDroid.md, Apêndice B5): a lista B5
# da spec é uma WHITELIST — só as entradas com a flag `b5` são concedidas ao
# app em análise (o runtime se posiciona como system; marcador
# runtime-is-system). Signature-class FORA da whitelist (ex.: BATTERY_STATS)
# recebe estado denied_system: o Android real nega a apps de terceiros e a
# sessão não a concede.
#
# issue #68: a documentação do Android define BATTERY_STATS como
# protectionLevel signature|privileged|development; a entrada antiga
# (B4/normal, sem flags) auto-concedia a permissão a apps de terceiros, o que
# o sistema real nega. Por isso ela NÃO carrega a flag b5.
[[permission]]
name = "BATTERY_STATS"
level = "signature"
group = ""
since_api = 1
flags = ["systemApp", "development"]
description = "Collect battery statistics (AOSP protectionLevel: signature|privileged|development — not for use by third-party apps since API 21)."


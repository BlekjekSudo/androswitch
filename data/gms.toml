# RustyDroid — data/gms.toml
# Apêndice E da spec: Google Play Services / Firebase (modo "sem GMS" honesto).
#
# Fonte executável consumida por rd-framework::fd_gms, `rd gms`,
# classificação MCP e `cargo xtask gms-report|gms-spec`.
#
# MODO HONESTO (validado): mode = "no-gms-honest" e network = "none" em
# TODOS os serviços. Não há processo GMS, conta Google nem backend real.
# As APIs existem como shims host com respostas estruturadas,
# determinísticas e programáveis pelo agente; eventos são capturados
# localmente, nunca enviados. `supported`/`partial` medem o SHIM, jamais
# paridade com os servidores do Google.
#
# Status: mesma semântica conservadora dos Apêndices C/D.
schema_version = 1
source = "RustyDroid.md Appendix E"
api_floor = 26
api_ceiling = 36
mode = "no-gms-honest"

[[category]]
id = "gms-core"
name = "GMS core"
summary = "Disponibilidade, erros e a Tasks API da qual todos os serviços dependem."

[[category]]
id = "gms-services"
name = "Play Services"
summary = "Location, Maps, Billing, Auth, Ads, Fit/Health, Cast/Nearby e Integridade — mocks offline programáveis."

[[category]]
id = "firebase"
name = "Firebase"
summary = "Core, Analytics, Auth, Messaging, Crashlytics e bancos locais (Firestore/RTDB) sem backend."

# ===================== GMS core =====================
[[service]]
id = "gms-common"
name = "GoogleApiAvailability / common"
category = "gms-core"
coordinates = "com.google.android.gms:play-services-base"
prefixes = ["com.google.android.gms.common"]
status = "not_implemented"
module = "none"
code = []
milestone = "future"
network = "none"
programmable = "Código de disponibilidade devolvido (SUCCESS/SERVICE_MISSING/...), textos de erro."
notes = "GoogleApiAvailability/GoogleApiClient/ConnectionResult sem shim: apps que checam disponibilidade no startup não recebem resposta host."
evidence = ["docs/appendix-d-e.md"]
gap_id = "gap-gms-common"
key_apis = ["com.google.android.gms.common.GoogleApiAvailability.isGooglePlayServicesAvailable", "com.google.android.gms.common.ConnectionResult"]

[[service]]
id = "gms-tasks"
name = "Tasks API"
category = "gms-core"
coordinates = "com.google.android.gms:play-services-tasks"
prefixes = ["com.google.android.gms.tasks"]
status = "not_implemented"
module = "none"
code = []
milestone = "future"
network = "none"
programmable = "Resultados/exceções de Tasks de todos os serviços E nascem aqui; listeners disparam deterministicamente."
notes = "Task/TaskCompletionSource/Tasks sem modelo host — é a fundação de Location/Auth/Firestore/FCM e precisa existir antes deles."
evidence = ["docs/appendix-d-e.md"]
gap_id = "gap-gms-tasks"
key_apis = ["com.google.android.gms.tasks.Task.addOnSuccessListener", "com.google.android.gms.tasks.Tasks.forResult"]


notes = "S7: a cadeia AppCompatActivity→FragmentActivity→ComponentActivity→Activity e os widgets AppCompat* (TextView/EditText/Button/CheckBox/ImageView/Spinner/Toolbar…) resolvem na hierarquia builtin do classpath: AppCompatActivity ganha estado host de Activity (launch/lifecycle do framework) e os widgets inflam de AXML como as contrapartes do framework mesmo sem o DEX da lib; check-cast para LifecycleOwner/ViewModelStoreOwner também resolve. AppCompatDelegate, temas/recursos AppCompat, ActionBar e menus continuam fora (o DEX da lib, quando presente, corre sobre estas bases)."

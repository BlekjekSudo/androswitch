modules = ["LANG-10"]
strategy = "Shared DEX + futuro render Compose MP"
adapter_crate = "rd-engine-compose-mp"
runtime_status = "not_implemented"
notes = "Não é possível distinguir KMP/Compose MP apenas pela presença de DEX."

[[engine.rule]]
state = "candidate"
all = ["root-dex"]
any = []
explanation = "DEX é compartilhado: não identifica a linguagem de origem."

[[engine.rule]]
state = "candidate"
all = ["suffix:.klib"]
any = []
explanation = "klib é pista, não prova render Compose Multiplatform."


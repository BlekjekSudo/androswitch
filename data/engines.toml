# Apêndice G: metadados, não promessas de execução.
schema_version = 1
scope = "registry-and-detection-only"

[[module]]
id = "LANG-01"
feature = "lang-01"
depends_on = []
notes = "DEX compartilhado; VM existente tem cobertura parcial."

[[module]]
id = "LANG-02"
feature = "lang-02"
depends_on = ["LANG-01"]
notes = "ELF/JNI; loaders e JNI completos ainda não implementados."

[[module]]
id = "LANG-03"
feature = "lang-03"
depends_on = ["LANG-02"]
notes = "Rust NDK reutiliza a fronteira ELF/JNI."

[[module]]
id = "LANG-04"
feature = "lang-04"
depends_on = ["LANG-02"]
notes = "Flutter: Dart AOT e engine/render próprio pendentes."

[[module]]
id = "LANG-05"
feature = "lang-05"
depends_on = ["LANG-02"]
notes = "JS/RN/NativeScript: engine JS e bridges pendentes."

[[module]]
id = "LANG-06"
feature = "lang-06"
depends_on = ["LANG-01"]
notes = "WebView/bridges Android; não baixa páginas na detecção."

[[module]]
id = "LANG-07"
feature = "lang-07"
depends_on = ["LANG-02"]
notes = "Mono/IL e render de MAUI/Avalonia pendentes."

[[module]]
id = "LANG-08"
feature = "lang-08"
depends_on = ["LANG-07"]
notes = "União das rotas Unity Mono e IL2CPP; não implica suporte gráfico."

[[module]]
id = "LANG-09"
feature = "lang-09"
depends_on = ["LANG-02"]
notes = "Pontes independentes de engines; não embute engines no registro."

[[module]]
id = "LANG-10"
feature = "lang-10"
depends_on = ["LANG-01"]
notes = "Shared DEX é possível; render Compose MP exige trabalho adicional."

[[module]]
id = "LANG-11"
feature = "lang-11"
depends_on = ["LANG-01"]
notes = "Java gerado; só o subconjunto DEX já disponível."

[[module]]
id = "LANG-12"
feature = "lang-12"
depends_on = ["LANG-01"]
notes = "WASM in-app; bridge JNI/JS escolhida na implementação futura."

[[engine]]
number = 1
id = "java"
name = "Java"
artifact = "classes*.dex"
modules = ["LANG-01"]
strategy = "VM DEX própria"
adapter_crate = "rd-vm"
runtime_status = "partial_dex"
notes = "DEX tem suporte parcial, não execução universal de Java."

[[engine.rule]]
state = "candidate"
all = ["root-dex"]
any = []
explanation = "DEX é compartilhado: não identifica a linguagem de origem."

[[engine]]
number = 2
id = "kotlin"
name = "Kotlin"
artifact = "classes*.dex"
modules = ["LANG-01"]
strategy = "VM DEX; coroutines/threads dependem da cobertura da VM"
adapter_crate = "rd-vm"
runtime_status = "partial_dex"
notes = "Dependências Kotlin não provam que o app foi escrito em Kotlin."

[[engine.rule]]
state = "candidate"
all = ["root-dex"]
any = []
explanation = "DEX é compartilhado: não identifica a linguagem de origem."

[[engine]]
number = 3
id = "kotlin-multiplatform"
